name: Windows-Version bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/windows.yml", "index.html", "treibgut/index.html", "eisenfront/index.html", "neustadt/index.html"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Installer bauen
        working-directory: desktop
        run: npm run dist
      - name: Version lesen
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Salvage-and-Grind-Windows
          path: desktop/dist/*.exe
      - name: Download-Seite (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.v.outputs.version }}
          name: Salvage & Grind ${{ steps.v.outputs.version }} für Windows
          body: Installer für Windows. Herunterladen, starten, fertig. Nur Spielgeld.
          files: desktop/dist/*.exe
